name: Release cache

# Release builds run on version tags, and a tag can only use build caches
# saved on main. This keeps one warm for each release job: the same
# release-profile builds, clippy and tests as checks.yml and the release
# builds (unsigned), so a release compiles only Splashdown's own crates. On
# Windows it also caches the Tauri CLI and the signing tool, which takes
# minutes to compile.
#
# It runs when dependencies change, not on a release's version bump: that
# changes Cargo.lock too, but the release can't use what it would save, and
# the cache from before the bump still holds every dependency.

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - ".cargo/config.toml"
      # What changes how dependencies compile.
      - "scripts/win-cpu-floor.ps1"
      - ".github/workflows/checks.yml"
      - ".github/workflows/release-cache.yml"
  schedule:
    # Weekly, so a new stable Rust (part of the cache key) is picked up.
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Read-only unless a job says otherwise: no step here needs to write to
# the repository.
permissions:
  contents: read

concurrency:
  group: release-cache
  cancel-in-progress: true

env:
  # The same as release.yml: environment variables are part of the cache key.
  CARGO_TERM_COLOR: always

jobs:
  mac:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release ')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: mac-release
      - name: Fetch sherpa-onnx's libraries again
        # sherpa-onnx-sys's build script downloads its libraries into
        # target/. The cache keeps that folder but not the files in it, and
        # the script, finding the folder, wouldn't download them again.
        run: |
          [ -d target ] || exit 0
          find target -type d \( -name sherpa-onnx-prebuilt -o -name 'sherpa-onnx-sys-*' \) -prune -exec rm -rf {} +
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-binstall
      - name: Install the Tauri CLI
        # The Mac builds are zip files, though tauri-cli's binstall settings
        # say tgz.
        env:
          # binstall asks GitHub's API for the prebuilt binary; without a
          # token that's rate limited, and it waits, then compiles instead.
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall tauri-cli --version "2.12.4" --no-confirm --locked --pkg-fmt zip
      - name: Clippy and tests, as the release's checks run them
        # The same clippy lines as checks.yml, so everything they need is
        # in the cache.
        run: |
          cargo clippy --release --workspace --all-targets --locked --target aarch64-apple-darwin -- -D warnings
          cargo clippy --release -p splashdown-cli --no-default-features --all-targets --locked --target aarch64-apple-darwin -- -D warnings
          cargo test --release --workspace --locked --target aarch64-apple-darwin --no-run
      - name: Build both architectures
        run: |
          cargo build --release --locked -p splashdown-llm -p splashdown-mcp --target aarch64-apple-darwin
          cargo build --release --locked -p splashdown-llm -p splashdown-mcp --target x86_64-apple-darwin
          cargo build --release --locked -p splashdown-cli --no-default-features --target-dir target/slim --target aarch64-apple-darwin
          cargo build --release --locked -p splashdown-cli --no-default-features --target-dir target/slim --target x86_64-apple-darwin
          cargo tauri build --target universal-apple-darwin --bundles app --no-sign

  windows:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release ')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-release
          # The fast local-model helper builds outside target\ (a short
          # path; see scripts/package-win.ps1).
          cache-directories: ${{ runner.temp }}\llm
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-binstall
      # Installed after the cache step, so they're saved with it.
      - name: Install the Tauri CLI and the signing tool
        shell: pwsh
        env:
          # binstall asks GitHub's API for the prebuilt binary; without a
          # token that's rate limited, and it waits, then compiles instead.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cargo binstall tauri-cli --version "2.12.4" --no-confirm --locked
          if (-not (Get-Command artifact-signing-cli -ErrorAction SilentlyContinue)) {
            cargo binstall artifact-signing-cli --version "0.12.0" --no-confirm --locked
          }
      - uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1
        with:
          # Pinned so the action's cache stays valid (as in release.yml).
          vulkan_version: 1.4.363.1
          install_runtime: false
          cache: true
      - name: Build the speech library for a named processor, not this machine's
        # Before anything compiles it, so the cached library is the one the
        # checks and the installer both use (scripts/win-cpu-floor.ps1).
        shell: pwsh
        run: scripts/win-cpu-floor.ps1
      - name: Clippy and tests, as the release's checks run them
        # The same clippy lines as checks.yml. In bash, as there: PowerShell
        # carries on after a command fails and reports only the last one's
        # result.
        shell: bash
        run: |
          cargo clippy --release --workspace --all-targets --locked -- -D warnings
          cargo clippy --release -p splashdown-cli --no-default-features --all-targets --locked -- -D warnings
          cargo test --release --workspace --locked --no-run
      - name: Build the installer (unsigned)
        shell: pwsh
        env:
          SPLASHDOWN_LLM_TARGET: ${{ runner.temp }}\llm
        run: scripts/package-win.ps1
