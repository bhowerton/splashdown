name: CI

# Every push gets the quick checks (formatting, licenses), which need no
# build. The full build (clippy and the tests on macOS and Windows) runs on
# pull requests, and on main by hand (Actions → CI → Run workflow). A
# release runs the same clippy and tests inside its own release builds
# (release.yml), so nothing ships unchecked and nothing is built twice.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      installer:
        description: Also build an unsigned Windows test installer
        type: boolean
        default: false

# Read-only unless a job says otherwise: no step here needs to write to
# the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  licenses:
    # Every dependency's license must be compatible with MIT/Apache-2.0
    # distribution (deny.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses

  build:
    name: build (${{ matrix.os }})
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        # The Apple shim needs the macOS 26 SDK (Xcode 26), so the Mac job
        # runs on the macOS 26 image. The app itself supports macOS 12+.
        os: [macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Select Xcode 26
        if: runner.os == 'macOS'
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version
          xcrun --show-sdk-version
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fetch sherpa-onnx's libraries again
        if: runner.os == 'macOS'
        # sherpa-onnx-sys's build script downloads its libraries into
        # target/. The cache keeps that folder but not the files in it, and
        # the script, finding the folder, wouldn't download them again.
        run: |
          [ -d target ] || exit 0
          find target -type d \( -name sherpa-onnx-prebuilt -o -name 'sherpa-onnx-sys-*' \) -prune -exec rm -rf {} +
      - name: Build the speech library for a named processor, not this machine's
        if: runner.os == 'Windows'
        # Otherwise it's tuned to whichever machine builds it, and a build
        # restored from the cache stops with "illegal instruction" on a
        # machine with an older processor. The same setting as the
        # installer's (scripts/win-cpu-floor.ps1).
        shell: pwsh
        run: scripts/win-cpu-floor.ps1
      - name: Clippy
        # In bash on Windows too: PowerShell, the default there, carries on
        # after a command fails and reports only the last one's result, so
        # a failure of the first of these two went unnoticed.
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          # The remote control alone, as the app ships it.
          cargo clippy -p splashdown-cli --no-default-features --all-targets --locked -- -D warnings
      - name: Test
        # Also builds the app, so there's no separate build step.
        run: cargo test --workspace --locked

  windows-installer:
    # A test installer, for trying the latest code on Windows without the
    # build tools: tick the box when running CI by hand, then download
    # "windows-installer" from the run's summary page. Unsigned and without
    # update files; releases come from release.yml.
    if: github.event_name == 'workflow_dispatch' && inputs.installer
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The release cache (release-cache.yml), which builds the same
          # way. Only read: that job keeps it up to date.
          shared-key: windows-release
          save-if: false
          # The fast local-model helper builds outside target\ (a short
          # path; see scripts/package-win.ps1).
          cache-directories: ${{ runner.temp }}\llm
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-binstall
      - name: Install the Tauri CLI
        # A prebuilt binary (compiling it took 6–10 minutes); cargo-binstall
        # compiles it only if there's none for this platform.
        env:
          # binstall asks GitHub's API for the prebuilt binary; without a
          # token that's rate limited, and it waits, then compiles instead.
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall tauri-cli --version "2.12.4" --no-confirm --locked
      - uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1
        with:
          # For llama.cpp's Vulkan backend in the local-model helper; pinned
          # so the action's cache stays valid.
          vulkan_version: 1.4.363.1
          install_runtime: false
          cache: true
          cache_save_if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the installer
        shell: pwsh
        env:
          SPLASHDOWN_LLM_TARGET: ${{ runner.temp }}\llm
        run: scripts/package-win.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: target/release/bundle/release/Splashdown-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14
