name: Website

# Publishes site/ to GitHub Pages at https://splashdown.app. The logo,
# animation and screenshots are copied in from where the README uses them,
# so there's one copy of each in the repository.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/assets/**"
      - "app/src-tauri/icons/source/icon.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Gather the shared images
        run: |
          cp app/src-tauri/icons/source/icon.svg site/assets/
          cp docs/assets/demo.svg docs/assets/actions.svg docs/assets/sources.svg docs/assets/sources-tall.svg site/assets/
          cp docs/assets/readme/*.png site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
