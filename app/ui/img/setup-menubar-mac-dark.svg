</defs><style>:root{--panel:#2B2C32;--screen:#25272F;--bar:#1B1C21;--line:#4A4C56;--text:#ECECEF;--grey:#555864;--grey2:#42444E;
--track:#5E616D;--accent:#3C8BFF;--soft:#1F3A6B;--key:#3A3C45;--keyside:#202127;--body:#2C2E36;--hover:#3A3C46;--sh:.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--text)}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.screen{fill:var(--screen);stroke:var(--line);stroke-width:2}
.bar{fill:var(--bar)}
.hair{stroke:var(--line);stroke-width:1.5;fill:none}
.g1{fill:var(--grey)}.g2{fill:var(--grey2)}
.ink{stroke:var(--text);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.inkf{fill:var(--text)}
.acc{fill:var(--accent)}.accs{fill:var(--accent);stroke:none}
.accline{stroke:var(--accent);fill:none}
.body{fill:var(--body);stroke:var(--line);stroke-width:1.5}
.key{fill:var(--key);stroke:var(--line);stroke-width:1.5}
.side{fill:var(--keyside)}
.tk{fill:var(--soft);stroke:var(--accent);stroke-width:2.5}
.soft{fill:var(--soft)}
.wh{fill:#fff}

@keyframes a1{0%,2%{opacity:0} 8%,94%{opacity:1} 99%,100%{opacity:0}}.a1{animation:a1 6s ease-in-out 0s infinite}
@keyframes a2{0%{transform:scale(1)} 50%{transform:scale(1.14)} 100%{transform:scale(1)}}.a2{animation:a2 1.5s ease-in-out 0s infinite}
@keyframes a3{0%,39%{opacity:0;transform:translateY(-6px)} 45%,92%{opacity:1;transform:none} 97%,100%{opacity:0;transform:translateY(-6px)}}.a3{animation:a3 6s ease-in-out 0s infinite}
@keyframes a4{0%,52%{fill:transparent} 56%,100%{fill:var(--accent)}}.a4{animation:a4 6s ease-in-out 0s infinite}
