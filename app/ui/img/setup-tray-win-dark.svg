@keyframes a3{0%,28%{opacity:0;transform:translateY(8px)} 34%,70%{opacity:1;transform:none} 76%,100%{opacity:0;transform:translateY(8px)}}.a3{animation:a3 6s ease-in-out 0s infinite}
@keyframes a4{0%,48%{opacity:1} 52%,100%{opacity:.25}}.a4{animation:a4 6s ease-in-out 0s infinite}
