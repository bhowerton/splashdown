city=".75"/><use class="a4" href="#app" x="367" y="86" width="34" height="34" style="opacity:.25"/></g><g class="a5" style="opacity:0"><use href="#app" x="-17" y="-17" width="34" height="34"/></g><use class="a6" href="#app" x="448" y="194" width="24" height="24"/><circle class="accline a7" cx="460" cy="206" r="24" stroke-width="3" style="opacity:0;transform-box:fill-box;transform-origin:center"/><g class="a8" style="opacity:0"><use href="#ptr" width="18" height="24" transform="scale(1.15)" overflow="visible"/></g></svg>
