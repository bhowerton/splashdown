<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".22"/></filter>
</defs><style>:root{--panel:#fff;--screen:#EEF1F7;--bar:#fff;--line:#CFD3DC;--text:#1D1E23;--grey:#C3C7D1;--grey2:#DDE0E7;
--track:#B4B9C5;--accent:#0A6CF0;--soft:#DCE9FD;--key:#fff;--keyside:#C9CDD7;--body:#E2E5EC;--hover:#E3E6EE;--sh:.22}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--text)}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.screen{fill:var(--screen);stroke:var(--line);stroke-width:2}
.bar{fill:var(--bar)}
.hair{stroke:var(--line);stroke-width:1.5;fill:none}
.g1{fill:var(--grey)}.g2{fill:var(--grey2)}
.ink{stroke:var(--text);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.inkf{fill:var(--text)}
.acc{fill:var(--accent)}.accs{fill:var(--accent);stroke:none}
.accline{stroke:var(--accent);fill:none}
.body{fill:var(--body);stroke:var(--line);stroke-width:1.5}
.key{fill:var(--key);stroke:var(--line);stroke-width:1.5}
.side{fill:var(--keyside)}
.tk{fill:var(--soft);stroke:var(--accent);stroke-width:2.5}
.soft{fill:var(--soft)}
.wh{fill:#fff}

@keyframes a1{0%,45%{fill:var(--track)} 49%,100%{fill:var(--accent)}}.a1{animation:a1 5.6s ease-in-out 0s infinite}
@keyframes a2{0%,45%{transform:translateX(0)} 49%,100%{transform:translateX(22px)}}.a2{animation:a2 5.6s ease-in-out 0s infinite}
@keyframes a3{0%,46%{transform:scale(.4);opacity:0} 47%{transform:scale(.4);opacity:.7} 60%{transform:scale(1);opacity:0} 61%,100%{transform:scale(1);opacity:0}}.a3{animation:a3 5.6s ease-out 0s infinite}
@keyframes a4{0%{transform:translate(420px,214px);opacity:0} 6%{transform:translate(420px,214px);opacity:1} 38%,45%{transform:translate(444px,105px) scale(1);opacity:1} 47%{transform:translate(444px,105px) scale(.82);opacity:1} 52%,86%{transform:translate(444px,105px) scale(1);opacity:1} 92%,100%{transform:translate(430px,222px);opacity:0}}.a4{animation:a4 5.6s ease-in-out 0s infinite}</style><g filter="url(#sh)"><rect class="panel" x="70" y="14" width="420" height="212" rx="16"/></g><g opacity=".55"><rect class="g1" x="92" y="38" width="32" height="32" rx="8"/><rect class="g2" x="136" y="48" width="118" height="12" rx="6"/></g><g opacity=".55"><rect style="fill:var(--track)" x="416" y="39" width="52" height="30" rx="15"/><circle class="wh" cx="431" cy="54" r="11.5"/></g><rect class="soft" x="78" y="76" width="404" height="46" rx="11"/><use href="#app" x="92" y="86" width="32" height="32"/><text x="136" y="108.5" font-size="19" font-weight="700">Splashdown</text><rect class="a1" x="416" y="87" width="52" height="30" rx="15" style="fill:var(--accent)"/><circle class="wh a2" cx="431" cy="102" r="11.5" style="transform:translateX(22px)"/><g opacity=".55"><rect class="g1" x="92" y="134" width="32" height="32" rx="8"/><rect class="g2" x="136" y="144" width="96" height="12" rx="6"/></g><g opacity=".55"><rect style="fill:var(--track)" x="416" y="135" width="52" height="30" rx="15"/><circle class="wh" cx="431" cy="150" r="11.5"/></g><g opacity=".55"><rect class="g1" x="92" y="182" width="32" height="32" rx="8"/><rect class="g2" x="136" y="192" width="134" height="12" rx="6"/></g><g opacity=".55"><rect style="fill:var(--track)" x="416" y="183" width="52" height="30" rx="15"/><circle class="wh" cx="431" cy="198" r="11.5"/></g><circle class="accline a3" cx="442" cy="102" r="24" stroke-width="3" style="opacity:0;transform-box:fill-box;transform-origin:center"/><g class="a4" style="opacity:0"><use href="#ptr" width="18" height="24" transform="scale(1.15)" overflow="visible"/></g></svg>
