<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scratchpad</title>
<link rel="stylesheet" href="settings.css">
<link rel="stylesheet" href="scratchpad.css">
</head>
<body class="sp-body">
<main class="sp">
  <section id="sp-editor" class="sp-view">
    <textarea id="sp-note" aria-label="Note" placeholder="Hold your dictation key and speak, or type."></textarea>
    <footer class="sp-bar">
      <button class="link" id="sp-show-earlier">Earlier notes</button>
      <span class="sp-grow"></span>
      <button class="btn" id="sp-copy">Copy</button>
      <button class="btn" id="sp-new">New note</button>
      <button class="btn primary sp-send" id="sp-send">Send</button>
    </footer>
  </section>

  <section id="sp-earlier-view" class="sp-view" hidden>
    <header class="sp-bar sp-head">
      <button class="link" id="sp-back">‹ Back to note</button>
      <span class="sp-grow"></span>
      <small class="sp-muted">Kept on this computer · the last 20</small>
    </header>
    <ul id="sp-earlier" class="sp-list" aria-label="Earlier notes"></ul>
    <p id="sp-empty" class="sp-empty" hidden>No earlier notes. “New note” moves the current one here.</p>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="common.js"></script>
<script src="scratchpad.js"></script>
</body>
</html>
