[package]
name = "splashdown"
description = "Hold a key, say it, and the text appears in the focused field."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono.workspace = true
directories.workspace = true
reqwest.workspace = true
unicode-segmentation = "1"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
tokio = { workspace = true, features = ["time"] }
dotenvy.workspace = true
hound.workspace = true
regex = "1"
splashdown-audio.workspace = true
splashdown-config.workspace = true
splashdown-control.workspace = true
splashdown-core.workspace = true
splashdown-platform.workspace = true
splashdown-providers = { workspace = true, features = ["local-speech", "natural-voice", "voiceprints"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
tauri-plugin-dialog = "2"
trash = "5"

[dev-dependencies]
async-trait.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
splashdown-apple-shim.workspace = true
