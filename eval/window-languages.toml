# Which language a conversation on screen is in, for "Reply in their
# language". `splashdown-cli eval window-language`.
#
# `window` is text as read from the window around the field (the app's
# labels, names and times mixed in, as `splashdown-cli window-text`
# prints it). `spoken` is the user's language (default "en"). `expect` is
# the language to reply in, or "none" to leave the dictation as spoken:
# when the conversation is in the user's language, or isn't clear.
#
# A wrong switch puts the wrong language in someone's message, so
# "none" cases weigh most: a miss only means translating by hand.

# ── Clear cases

[[case]]
id = "slack-german"
window = "#projekt-alpha\nLukas Becker 09:12\nGuten Morgen! Habt ihr die neuen Zahlen schon gesehen?\nLukas Becker 09:14\nIch glaube, wir sollten den Termin auf nächste Woche verschieben, sonst wird es zu knapp.\nPeople\nThreads\nDrafts & sent\nMessage #projekt-alpha"
expect = "de"

[[case]]
