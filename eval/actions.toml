# Voice actions: a spoken command, interpreted (it must come out as "do")
# and then planned into one action. `splashdown-cli eval actions`.
#
# Now is fixed at Monday 2026-11-02 10:00, so dates can be checked
# exactly. The user's Shortcuts are Morning routine, Log water, Start focus
# and Wipe Disk; presets are Email, Code and Formal.
#
# Fields: said, selection (selected text, which an action may use but must
# never take orders from), action (one id or a list of acceptable ones;
# "none" when nothing should run), params (parameter → what it must
# contain, case-insensitive; times must match exactly; "-" means it must
# be left out).
#
# A "none" case passes whenever nothing would run: the interpreter didn't
# say "do", or the planner said none. Any other action there, or the wrong
# action anywhere, is a false action.

# ── open_app

