# ── Changes

[[case]]
id = "rev-shorter"
asked = "reply saying I'm in and ask about parking"
app = "Mail"
draft = "Hi Sam,\n\nThanks so much for organizing this, it sounds like a great way to celebrate the launch. Count me in for the dinner on Thursday at 7 at Marlow & Sons. Do you happen to know whether there's parking nearby, or would it be easier to take the train? Let me know if I can bring anything.\n\nSee you Thursday,\nBen"
change = "shorter"
has = ["sam", "parking"]
max_words = 45

[[case]]
id = "rev-add-fact"
asked = "reply saying I'm in and ask about parking"
app = "Mail"
draft = "Hi Sam,\n\nCount me in for Thursday at 7. Is there parking near Marlow & Sons?\n\nThanks,\nBen"
change = "add that I'm bringing my partner"
has = ["parking", "partner", "thursday"]

[[case]]
id = "rev-only-the-day"
asked = "reply saying I'm in and ask about parking"
app = "Mail"
draft = "Hi Sam,\n\nCount me in for Thursday. Is there parking nearby?\n\nThanks,\nBen"
change = "say Friday instead of Thursday"
has = ["friday", "parking", "sam"]
not = ["thursday"]

[[case]]
id = "rev-in-german"
asked = "reply saying I'm in and ask about parking"
app = "Mail"
draft = "Hi Sam,\n\nCount me in for Thursday at 7. Is there parking near Marlow & Sons?\n\nThanks,\nBen"
change = "in German"
has = ["sam"]
lang = "de"

[[case]]
id = "rev-warmer"
asked = "decline the meetup invitation"
app = "Mail"
draft = "Hi Priya,\n\nI can't speak on the 14th.\n\nBen"
change = "warmer"
has = ["priya", "14"]

# ── From the window (nothing selected)

[[case]]
id = "win-slack-thread"
window = "#launch\nPriya Shah 10:02 AM\nMorning! Standup moved to 10:30 today.\nJordan Lee 10:15 AM\nCan someone review the pricing page copy before lunch? It's in the Launch doc.\nPeople\nThreads\nDrafts & sent"
asked = "reply saying I'll take a look before noon"
app = "Slack"
has_any = ["pricing", "look", "before noon", "noon"]
not = ["standup", "dear", "regards"]
max_words = 40

[[case]]
id = "win-mail-thread"
window = "Inbox (3)\nFlagged\nRe: Office move\nFrom: Dana Ortiz\nTo: Ben\nHi Ben, movers come Thursday at 8. Can you have your desk packed by Wednesday evening? Thanks, Dana\nOn Mon, Ben wrote: Sounds good, keep me posted."
asked = "reply saying yes, I'll have it packed"
app = "Mail"
user = "Ben"
has = ["dana"]
has_any = ["wednesday", "packed"]
not = ["inbox", "flagged"]


# ── Short writes (every "write…" goes through Compose)

[[case]]
id = "en-write-polite-no"
asked = "write a polite no"
app = "Messages"
not = ["here's", "here is", "dear"]
max_words = 30

[[case]]
id = "en-add-sign-off"
asked = "add a sign-off"
app = "Mail"
user = "Ben"
has = ["ben"]
max_words = 12
