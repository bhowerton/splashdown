# ── Spoken over selected text (`last` is the selection): an edit stays an
# edit, a request to do something with it is "do"

[[case]]
id = "sel-email"
said = "email this to Sam"
last = "Q3 numbers: revenue up 12%, churn down to 3.1%, two new enterprise customers."
expect = "do"

[[case]]
id = "sel-todo"
said = "add this to my to-dos"
last = "Call the bank about the card"
expect = "do"

[[case]]
id = "sel-search"
said = "search the web for this"
last = "Kubernetes ingress returns 504 after 60 seconds"
expect = "do"

[[case]]
id = "sel-formal"
said = "make this more formal"
last = "hey cant make it tmrw, can we do thurs"
expect = "replace_last"

[[case]]
id = "sel-translate"
said = "translate this into German"
last = "The meeting moved to Thursday at 3."
expect = "replace_last"
text = ["Donnerstag"]

# ── Reading aloud

[[case]]
id = "en-read"
said = "read this to me"
last = "Thanks for the update. I'll look at the numbers tomorrow and get back to you before the call."
expect = "read"

[[case]]
id = "en-read-back"
said = "read that back to me"
last = "Can we move the review to Thursday afternoon?"
expect = "read"

[[case]]
id = "en-read-summary"
said = "read me a summary of this"
last = "I wanted to let you know that I've been thinking about the proposal you sent over last week and I think overall it looks really good but there are a few small things I'd like to go over with you when you have a moment."
expect = "read"
text = ["summar"]

[[case]]
id = "en-read-gist"
said = "what's the gist of this, read it out"
last = "Quarterly revenue grew 12 percent, mostly from the new enterprise plan, while churn stayed flat at 3 percent."
expect = "read"

[[case]]
id = "de-read"
said = "lies mir das vor"
last = "Wir treffen uns am Donnerstag um zehn im großen Besprechungsraum."
expect = "read"

[[case]]
id = "es-read-summary"
said = "léeme un resumen de esto"
last = "El equipo terminó la migración el viernes y el lunes empezamos las pruebas con los primeros clientes."
expect = "read"

[[case]]
id = "en-read-is-dictation"
said = "I read the report and it looks good to me"
expect = ["unclear", "write"]

# ── Drafts for the Compose panel (longer than a line or two)

[[case]]
id = "en-compose-reply"
said = "draft a reply saying I'm in and ask about parking"
app = "Mail"
expect = "compose"

[[case]]
id = "en-compose-email"
said = "write an email to Dana about the launch moving to Thursday"
app = "Mail"
expect = ["compose", "do"]

[[case]]
id = "en-compose-reply-to-selection"
said = "reply to this saying no thanks"
last = "Hi Ben, would you like to join our running club on Saturdays? Lena"
