[[case]]
id = "en-weather-question"
said = "what's the weather going to be like tomorrow"
expect = ["ask", "do"]

[[case]]
id = "en-how-to"
said = "how do I take a screenshot on a Mac"
expect = "ask"

[[case]]
id = "en-look-up"
said = "look up the population of Lisbon"
expect = ["ask", "do"]

