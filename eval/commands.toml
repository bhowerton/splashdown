# Spoken commands (instruction key first, nothing dictated): which action
# the interpreter picks. `splashdown-cli eval commands`.
#
# Each case runs with voice actions off and on. Cases expecting "do" are
# only scored with actions on. An edit read as "do" with actions on is a
# false action, the number that must stay at zero.
#
# Fields: said, last (the last dictation, before the cursor), app,
# expect (one action or a list of acceptable ones), text (case-insensitive
# substrings the action's text must contain).

# ── Edits, English

[[case]]
id = "en-capitalize"
said = "capitalize that"
last = "can someone review my pr"
expect = "replace_last"

[[case]]
id = "en-formal"
said = "make that more formal"
last = "hey cant make it tonight sorry"
expect = "replace_last"

[[case]]
id = "en-shorter"
said = "make it shorter"
last = "I wanted to let you know that I've been thinking about the proposal you sent over last week and I think overall it looks really good but there are a few small things I'd like to go over with you when you have a moment."
expect = "replace_last"

[[case]]
id = "en-translate"
said = "translate that to Spanish"
last = "See you tomorrow at five."
expect = "replace_last"
text = ["mañana"]

[[case]]
id = "en-fix-word"
said = "change Tuesday to Thursday"
last = "Let's meet on Tuesday at noon."
expect = "replace_last"
text = ["Thursday"]

[[case]]
id = "en-bullets"
said = "turn that into a bullet list"
last = "We need milk, eggs, bread and coffee."
expect = "replace_last"

[[case]]
id = "en-delete-sentence"
said = "delete the last sentence"
last = "Thanks for the update. I'll check it tomorrow."
expect = "delete_last_sentence"

[[case]]
id = "en-delete-word"
said = "scratch that last word"
last = "I think we should go"
expect = ["delete_last_word", "replace_last"]

[[case]]
id = "en-undo"
said = "undo that"
last = "Sounds good, see you then."
expect = "undo_last"

[[case]]
id = "en-select"
said = "select that"
last = "The quarterly numbers are in."
expect = "select_last"

[[case]]
id = "en-bold"
said = "make that bold"
last = "Deadline is Friday"
expect = "bold_last"

[[case]]
id = "en-italic"
said = "italicize it"
last = "very important"
expect = "italic_last"

[[case]]
id = "en-send"
said = "send it"
last = "Running five minutes late."
app = "Slack"
expect = "press_enter"

[[case]]
id = "en-hit-enter"
said = "hit enter"
expect = "press_enter"

[[case]]
id = "en-sign-off"
said = "add a sign-off"
last = "Thanks for the update, I'll take a look this afternoon."
expect = ["write", "replace_last"]

[[case]]
id = "en-write-no"
said = "write a polite no"
expect = "write"

[[case]]
id = "en-ask-word"
said = "what's the German word for deadline"
expect = "ask"

[[case]]
id = "en-ask-days"
said = "how many days until Christmas"
expect = "ask"

[[case]]
id = "en-not-a-command"
said = "the meeting went well and everyone agreed"
expect = ["unclear", "write"]

