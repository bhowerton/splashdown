<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d">
<title id="t">Translating as you dictate</title>
<desc id="d">In a new email, holding Option and tapping T shows "→ Spanish"; tapping T again changes it to "→ French". Saying "see you Thursday at 3?" types "On se voit jeudi à 15 h ?". Then, in a work chat where Lukas writes in German, holding Option shows "→ German (their language)" with no key to press, and saying "sure, I'll send them to you tomorrow morning" types "Klar, ich schicke sie dir morgen früh."</desc>
<style>@keyframes scene-a{0.60%,48.00%{opacity:1} 48.60%,100%{opacity:0}}
.scene-a{animation:scene-a 16s linear infinite}
@keyframes pa-listen{0%,3.40%{opacity:0} 4.00%,8.00%{opacity:1} 8.60%,100%{opacity:0}}
.pa-listen{animation:pa-listen 16s linear infinite}
@keyframes pa-es{0%,8.00%{opacity:0} 8.60%,14.00%{opacity:1} 14.60%,100%{opacity:0}}
.pa-es{animation:pa-es 16s linear infinite}
@keyframes pa-fr{0%,14.00%{opacity:0} 14.60%,33.00%{opacity:1} 33.60%,100%{opacity:0}}
.pa-fr{animation:pa-fr 16s linear infinite}
@keyframes pa-work{0%,33.00%{opacity:0} 33.60%,37.40%{opacity:1} 38.00%,100%{opacity:0}}
.pa-work{animation:pa-work 16s linear infinite}
@keyframes pa-done{0%,37.40%{opacity:0} 38.00%,47.00%{opacity:1} 47.60%,100%{opacity:0}}
.pa-done{animation:pa-done 16s linear infinite}
@keyframes say-a{0%,16.40%{opacity:0} 17.00%,33.00%{opacity:1} 33.60%,100%{opacity:0}}
.say-a{animation:say-a 16s linear infinite}
@keyframes cover-a{0%,38.00%{transform:none}44.00%,100%{transform:translateX(262px)}}
.cover-a{animation:cover-a 16s linear infinite}
@keyframes typed-a{0%,37.40%{opacity:0} 38.00%,47.50%{opacity:1} 48.10%,100%{opacity:0}}
.typed-a{animation:typed-a 16s linear infinite}
@keyframes cur-a{0%,3.40%{opacity:0} 4.00%,38.00%{opacity:1} 38.60%,100%{opacity:0}}
.cur-a{animation:cur-a 16s linear infinite}
@keyframes press-opt{0.00%,3.90%{transform:none}4.00%,33.00%{transform:translateY(3px)}33.10%,53.90%{transform:none}54.00%,72.00%{transform:translateY(3px)}72.10%,100%{transform:none}}
@keyframes tint-opt{0.00%,3.90%{fill:#F4F6FB}4.00%,33.00%{fill:#FFD5D5}33.10%,53.90%{fill:#F4F6FB}54.00%,72.00%{fill:#FFD5D5}72.10%,100%{fill:#F4F6FB}}
.press-opt{animation:press-opt 16s linear infinite}.tint-opt{animation:tint-opt 16s linear infinite}
@keyframes press-t{0.00%,7.90%{transform:none}8.00%,9.40%{transform:translateY(3px)}9.50%,13.90%{transform:none}14.00%,15.40%{transform:translateY(3px)}15.50%,100%{transform:none}}
@keyframes tint-t{0.00%,7.90%{fill:#F4F6FB}8.00%,9.40%{fill:#FFE2C2}9.50%,13.90%{fill:#F4F6FB}14.00%,15.40%{fill:#FFE2C2}15.50%,100%{fill:#F4F6FB}}
.press-t{animation:press-t 16s linear infinite}.tint-t{animation:tint-t 16s linear infinite}
@keyframes hint-t{0%,8.00%{opacity:0} 8.60%,33.00%{opacity:1} 33.60%,100%{opacity:0}}
.hint-t{animation:hint-t 16s linear infinite}
@keyframes scene-b{0%,50.00%{opacity:0} 50.60%,99.40%{opacity:1}}
.scene-b{animation:scene-b 16s linear infinite}
@keyframes pb-listen{0%,53.40%{opacity:0} 54.00%,56.00%{opacity:1} 56.60%,100%{opacity:0}}
.pb-listen{animation:pb-listen 16s linear infinite}
@keyframes pb-de{0%,56.00%{opacity:0} 56.60%,72.00%{opacity:1} 72.60%,100%{opacity:0}}
.pb-de{animation:pb-de 16s linear infinite}
@keyframes pb-work{0%,72.00%{opacity:0} 72.60%,76.40%{opacity:1} 77.00%,100%{opacity:0}}
.pb-work{animation:pb-work 16s linear infinite}
@keyframes pb-done{0%,76.40%{opacity:0} 77.00%,98.00%{opacity:1} 98.60%,100%{opacity:0}}
.pb-done{animation:pb-done 16s linear infinite}
@keyframes say-b{0%,57.40%{opacity:0} 58.00%,72.00%{opacity:1} 72.60%,100%{opacity:0}}
.say-b{animation:say-b 16s linear infinite}
@keyframes cover-b{0%,77.00%{transform:none}85.00%,100%{transform:translateX(412px)}}
.cover-b{animation:cover-b 16s linear infinite}
@keyframes typed-b{0%,76.40%{opacity:0} 77.00%,99.00%{opacity:1} 99.60%,100%{opacity:0}}
.typed-b{animation:typed-b 16s linear infinite}
@keyframes cur-b{0%,53.40%{opacity:0} 54.00%,77.00%{opacity:1} 77.60%,100%{opacity:0}}
.cur-b{animation:cur-b 16s linear infinite}
@keyframes hint-their{0%,56.00%{opacity:0} 56.60%,72.00%{opacity:1} 72.60%,100%{opacity:0}}
.hint-their{animation:hint-their 16s linear infinite}

@keyframes bar{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
.bar{transform-box:fill-box;transform-origin:center;animation:bar .45s ease-in-out infinite alternate}
.bar:nth-child(2){animation-delay:-.15s}.bar:nth-child(3){animation-delay:-.3s}
.bar:nth-child(4){animation-delay:-.05s}.bar:nth-child(5){animation-delay:-.25s}.bar:nth-child(6){animation-delay:-.4s}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin .8s linear infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.caret{animation:blink 1s step-end infinite}
@keyframes twinkle{0%,100%{opacity:.9}50%{opacity:.35}}
.star{animation:twinkle 3s ease-in-out infinite}
.star:nth-of-type(2n){animation-delay:-1.4s}.star:nth-of-type(3n){animation-delay:-2.1s}

/* Without motion: the German reply, written. */
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  [class^="pa-"],[class^="pb-"],.say-a,.say-b,.scene-a,.hint-t,.hint-their,.cover-b,.typed-a,.cur-a,.cur-b{opacity:0}
  .scene-b,.typed-b,.pb-done{opacity:1}
}
</style>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="480" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#0A1440"/><stop offset=".65" stop-color="#16337A"/><stop offset="1" stop-color="#2F64B8"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="440" x2="0" y2="480" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#0F6FA8"/><stop offset="1" stop-color="#06305C"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
  </filter>
  <clipPath id="card"><rect width="960" height="480" rx="28"/></clipPath>
  <clipPath id="window"><rect x="150" y="40" width="660" height="206" rx="14"/></clipPath>
</defs>
<g clip-path="url(#card)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="960" height="480" fill="url(#sky)"/>
  <circle class="star" cx="70" cy="60" r="2.5" fill="#fff"/><circle class="star" cx="880" cy="90" r="3" fill="#fff"/><circle class="star" cx="110" cy="210" r="2" fill="#fff"/><circle class="star" cx="860" cy="230" r="2" fill="#fff"/><circle class="star" cx="40" cy="300" r="1.8" fill="#fff"/><circle class="star" cx="920" cy="330" r="2.2" fill="#fff"/>
  <path d="M0 452 C160 438 320 466 480 452 S800 438 960 452 V480 H0 Z" fill="url(#sea)"/>

  <!-- The app being dictated into. -->
  <g filter="url(#shadow)"><rect x="150" y="40" width="660" height="206" rx="14" fill="#fff"/></g>
  <g clip-path="url(#window)">
    <g class="scene-a"><rect x="150" y="40" width="660" height="40" fill="#EEF1F6"/><circle cx="174" cy="60" r="6" fill="#FF5F57"/><circle cx="194" cy="60" r="6" fill="#FEBC2E"/><circle cx="214" cy="60" r="6" fill="#28C840"/><text x="480" y="65" text-anchor="middle" font-size="14" fill="#6B7280">New message</text><text x="176" y="114" font-size="16" fill="#9CA3AF">To:</text><text x="206" y="114" font-size="16" fill="#374151">Camille Martin</text><line x1="170" y1="130" x2="790" y2="130" stroke="#E5E7EB"/><g class="typed-a"><text x="176" y="182" font-size="22" fill="#111827">On se voit jeudi à 15 h ?</text><g class="cover-a"><rect x="174" y="156" width="620" height="36" fill="#fff"/><rect class="caret" x="174" y="160" width="2" height="28" fill="#2563EB"/></g></g><g class="cur-a"><rect class="caret" x="176" y="160" width="2" height="28" fill="#2563EB"/></g></g>
    <g class="scene-b"><rect x="150" y="40" width="660" height="40" fill="#EEF1F6"/><circle cx="174" cy="60" r="6" fill="#FF5F57"/><circle cx="194" cy="60" r="6" fill="#FEBC2E"/><circle cx="214" cy="60" r="6" fill="#28C840"/><text x="480" y="65" text-anchor="middle" font-size="14" fill="#6B7280">#projekt-alpha</text><rect x="176" y="96" width="34" height="34" rx="8" fill="#6366F1"/><text x="193" y="119" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">LB</text><text x="222" y="108" font-size="14" font-weight="700" fill="#111827">Lukas Becker <tspan font-weight="400" fill="#6B7280">09:14</tspan></text><text x="222" y="130" font-size="16" fill="#374151">Kannst du mir die Zahlen bis morgen schicken?</text><rect x="170" y="152" width="620" height="76" rx="10" fill="#fff" stroke="#D1D5DB"/><g class="typed-b"><text x="186" y="196" font-size="22" fill="#111827">Klar, ich schicke sie dir morgen früh.</text><g class="cover-b"><rect x="174" y="170" width="620" height="36" fill="#fff"/><rect class="caret" x="174" y="174" width="2" height="28" fill="#2563EB"/></g></g><g class="cur-b"><text x="190" y="196" font-size="18" fill="#9CA3AF">Message #projekt-alpha</text><rect class="caret" x="186" y="174" width="2" height="28" fill="#2563EB"/></g></g>
  </g>

  <!-- The keys. -->
  <g font-weight="600" font-size="22" fill="#1F2937" text-anchor="middle">
    <g class="press-t"><rect class="tint-t" x="54" y="330" width="52" height="48" rx="10" fill="#F4F6FB"/><text x="80" y="362">T</text></g>
    <g class="press-opt"><rect class="tint-opt" x="118" y="330" width="52" height="48" rx="10" fill="#F4F6FB"/><text x="144" y="361">⌥</text></g>
  </g>
  <text x="80" y="398" text-anchor="middle" font-size="12" fill="#C7D2FE">tap</text>
  <text x="144" y="398" text-anchor="middle" font-size="12" fill="#C7D2FE">hold</text>
  <text class="hint-t" x="830" y="352" text-anchor="middle" font-size="13" fill="#C7D2FE">T again:</text>
  <text class="hint-t" x="830" y="370" text-anchor="middle" font-size="13" fill="#C7D2FE">next language</text>
  <text class="hint-their" x="864" y="352" text-anchor="middle" font-size="13" fill="#C7D2FE">no key to press:</text>
  <text class="hint-their" x="864" y="370" text-anchor="middle" font-size="13" fill="#C7D2FE">the chat is German</text>

  <!-- The overlay pill. -->
  <g class="pa-listen"><rect x="362.0" y="330" width="236" height="50" rx="25" fill="#17171C" fill-opacity=".94" filter="url(#shadow)"/><g transform="translate(362.0 0)"><circle cx="26" cy="355" r="6" fill="#F04545"/><text x="41" y="361" fill="#F4F4F5" font-size="17" font-weight="600">Listening</text><g><rect class="bar" x="144" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="154" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="164" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="174" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="184" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="194" y="344" width="4" height="22" rx="2" fill="#F04545"/></g></g></g><g class="pa-es"><rect x="362.0" y="330" width="236" height="50" rx="25" fill="#17171C" fill-opacity=".94" filter="url(#shadow)"/><g transform="translate(362.0 0)"><circle cx="26" cy="355" r="6" fill="#F04545"/><text x="41" y="361" fill="#F4F4F5" font-size="17" font-weight="600">→ Spanish</text><g><rect class="bar" x="144" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="154" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="164" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="174" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="184" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="194" y="344" width="4" height="22" rx="2" fill="#F04545"/></g></g></g><g class="pa-fr"><rect x="362.0" y="330" width="236" height="50" rx="25" fill="#17171C" fill-opacity=".94" filter="url(#shadow)"/><g transform="translate(362.0 0)"><circle cx="26" cy="355" r="6" fill="#F04545"/><text x="41" y="361" fill="#F4F4F5" font-size="17" font-weight="600">→ French</text><g><rect class="bar" x="144" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="154" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="164" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="174" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="184" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="194" y="344" width="4" height="22" rx="2" fill="#F04545"/></g></g></g><g class="pa-work"><rect x="365.0" y="330" width="230" height="50" rx="25" fill="#17171C" fill-opacity=".94" filter="url(#shadow)"/><g transform="translate(365.0 0)"><g><circle cx="28" cy="355" r="9" fill="none" stroke="#F4F4F5" stroke-opacity=".25" stroke-width="3"/><path class="spin" d="M28 346 a9 9 0 0 1 9 9" fill="none" stroke="#F4F4F5" stroke-width="3" stroke-linecap="round"/></g><text x="47" y="361" fill="#F4F4F5" font-size="17" font-weight="600">Translating…</text></g></g><g class="pa-done"><rect x="380.0" y="330" width="200" height="50" rx="25" fill="#17171C" fill-opacity=".94" filter="url(#shadow)"/><g transform="translate(380.0 0)"><path d="M19 355 l5 5 l10 -11" fill="none" stroke="#52CF66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="361" fill="#F4F4F5" font-size="17" font-weight="600">Inserted</text><text x="126" y="360" fill="#F4F4F5" fill-opacity=".6" font-size="13">1.1 s</text></g></g><g class="pb-listen"><rect x="362.0" y="330" width="236" height="50" rx="25" fill="#17171C" fill-opacity=".94" filter="url(#shadow)"/><g transform="translate(362.0 0)"><circle cx="26" cy="355" r="6" fill="#F04545"/><text x="41" y="361" fill="#F4F4F5" font-size="17" font-weight="600">Listening</text><g><rect class="bar" x="144" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="154" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="164" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="174" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="184" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="194" y="344" width="4" height="22" rx="2" fill="#F04545"/></g></g></g><g class="pb-de"><rect x="286.0" y="330" width="388" height="50" rx="25" fill="#17171C" fill-opacity=".94" filter="url(#shadow)"/><g transform="translate(286.0 0)"><circle cx="26" cy="355" r="6" fill="#F04545"/><text x="41" y="361" fill="#F4F4F5" font-size="17" font-weight="600">→ German (their language)</text><g><rect class="bar" x="296" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="306" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="316" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="326" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="336" y="344" width="4" height="22" rx="2" fill="#F04545"/><rect class="bar" x="346" y="344" width="4" height="22" rx="2" fill="#F04545"/></g></g></g><g class="pb-work"><rect x="365.0" y="330" width="230" height="50" rx="25" fill="#17171C" fill-opacity=".94" filter="url(#shadow)"/><g transform="translate(365.0 0)"><g><circle cx="28" cy="355" r="9" fill="none" stroke="#F4F4F5" stroke-opacity=".25" stroke-width="3"/><path class="spin" d="M28 346 a9 9 0 0 1 9 9" fill="none" stroke="#F4F4F5" stroke-width="3" stroke-linecap="round"/></g><text x="47" y="361" fill="#F4F4F5" font-size="17" font-weight="600">Translating…</text></g></g><g class="pb-done"><rect x="380.0" y="330" width="200" height="50" rx="25" fill="#17171C" fill-opacity=".94" filter="url(#shadow)"/><g transform="translate(380.0 0)"><path d="M19 355 l5 5 l10 -11" fill="none" stroke="#52CF66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="361" fill="#F4F4F5" font-size="17" font-weight="600">Inserted</text><text x="126" y="360" fill="#F4F4F5" fill-opacity=".6" font-size="13">1.0 s</text></g></g>

  <!-- What the user says. -->
  <text class="say-a" x="480" y="428" text-anchor="middle" font-size="19" font-style="italic" fill="#E6ECFF">“see you Thursday at 3?”</text>
  <text class="say-b" x="480" y="428" text-anchor="middle" font-size="19" font-style="italic" fill="#E6ECFF">“sure, I'll send them to you tomorrow morning”</text>
</g>
</svg>
