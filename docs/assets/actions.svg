@keyframes tint-shift{0%{fill:#F4F6FB} 3.10%{fill:#F4F6FB} 3.20%,4.20%{fill:#E4DAFF} 4.30%{fill:#F4F6FB} 36.43%{fill:#F4F6FB} 36.53%,37.53%{fill:#E4DAFF} 37.63%{fill:#F4F6FB} 69.77%{fill:#F4F6FB} 69.87%,70.87%{fill:#E4DAFF} 70.97%{fill:#F4F6FB} 100%{fill:#F4F6FB}}
.tint-shift{animation:tint-shift 18s linear infinite}
@keyframes duck{0%{transform:scaleX(1)} 1.40%{transform:scaleX(1)} 2.60%,15.00%{transform:scaleX(.25)} 16.20%{transform:scaleX(1)} 34.73%{transform:scaleX(1)} 35.93%,48.33%{transform:scaleX(.25)} 49.53%{transform:scaleX(1)} 68.07%{transform:scaleX(1)} 69.27%,81.67%{transform:scaleX(.25)} 82.87%{transform:scaleX(1)} 100%{transform:scaleX(1)}}
.duck{transform-box:fill-box;transform-origin:left center;animation:duck 18s ease-in-out infinite}
@keyframes quiet{0%{opacity:0} 2.00%{opacity:0} 2.60%,15.00%{opacity:1} 15.60%{opacity:0} 35.33%{opacity:0} 35.93%,48.33%{opacity:1} 48.93%{opacity:0} 68.67%{opacity:0} 69.27%,81.67%{opacity:1} 82.27%{opacity:0} 100%{opacity:0}}
.quiet{animation:quiet 18s linear infinite}
@keyframes loud{0%{opacity:1} 2.00%{opacity:1} 2.60%,15.00%{opacity:0} 15.60%{opacity:1} 35.33%{opacity:1} 35.93%,48.33%{opacity:0} 48.93%{opacity:1} 68.67%{opacity:1} 69.27%,81.67%{opacity:0} 82.27%{opacity:1} 100%{opacity:1}}
.loud{animation:loud 18s linear infinite}

@keyframes bar{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
.bar{transform-box:fill-box;transform-origin:center;animation:bar .45s ease-in-out infinite alternate}
.bar:nth-child(2){animation-delay:-.15s}.bar:nth-child(3){animation-delay:-.3s}
.bar:nth-child(4){animation-delay:-.05s}.bar:nth-child(5){animation-delay:-.25s}
.bar:nth-child(6){animation-delay:-.4s}.bar:nth-child(7){animation-delay:-.1s}
@keyframes eq{0%{transform:scaleY(.3)}100%{transform:scaleY(1)}}
.eq{transform-box:fill-box;transform-origin:bottom;animation:eq .6s ease-in-out infinite alternate}
.eq:nth-child(2){animation-delay:-.2s}.eq:nth-child(3){animation-delay:-.45s}.eq:nth-child(4){animation-delay:-.1s}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin .8s linear infinite}
@keyframes twinkle{0%,100%{opacity:.9}50%{opacity:.35}}
.star{animation:twinkle 3s ease-in-out infinite}
.star:nth-of-type(2n){animation-delay:-1.4s}.star:nth-of-type(3n){animation-delay:-2.1s}
.press-opt,.press-shift,.runitp{transform-box:fill-box}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .cmd0,.cmd1,.cmd2,.say0,.say1,.say2,.work0,.work1,.work2,.done1,.done2,.win1,.win2,.ask2,.quiet{opacity:0}
  .done0,.win0,.loud{opacity:1}
}
