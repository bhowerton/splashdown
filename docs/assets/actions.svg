<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d">
<title id="t">Splashdown voice actions</title>
<desc id="d">Holding Option, tapping Shift and saying "remind me at 5 to stretch" adds a reminder for 17:00; "search YouTube for paella recipes" opens the search; "deploy staging", one of the user's own actions, asks "Run Deploy staging?" with exactly what will run, and runs it. Music in the corner is turned down while each command is said.</desc>
<style>@keyframes cmd0{0%,1.40%{opacity:0} 2.00%,15.00%{opacity:1} 15.60%,100%{opacity:0}}
.cmd0{animation:cmd0 18s linear infinite}
@keyframes say0{0%,3.80%{opacity:0} 4.40%,16.00%{opacity:1} 16.60%,100%{opacity:0}}
.say0{animation:say0 18s linear infinite}
@keyframes work0{0%,15.00%{opacity:0} 15.60%,18.50%{opacity:1} 19.10%,100%{opacity:0}}
.work0{animation:work0 18s linear infinite}
@keyframes cmd1{0%,34.73%{opacity:0} 35.33%,48.33%{opacity:1} 48.93%,100%{opacity:0}}
.cmd1{animation:cmd1 18s linear infinite}
