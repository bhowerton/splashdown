.press-opt{animation:press-opt 18s linear infinite}
@keyframes tint-opt{0%{fill:#F4F6FB} 1.90%{fill:#F4F6FB} 2.00%,15.00%{fill:#E4DAFF} 15.10%{fill:#F4F6FB} 35.23%{fill:#F4F6FB} 35.33%,48.33%{fill:#E4DAFF} 48.43%{fill:#F4F6FB} 68.57%{fill:#F4F6FB} 68.67%,81.67%{fill:#E4DAFF} 81.77%{fill:#F4F6FB} 100%{fill:#F4F6FB}}
.tint-opt{animation:tint-opt 18s linear infinite}
@keyframes press-shift{0%{transform:none} 3.10%{transform:none} 3.20%,4.20%{transform:translateY(3px)} 4.30%{transform:none} 36.43%{transform:none} 36.53%,37.53%{transform:translateY(3px)} 37.63%{transform:none} 69.77%{transform:none} 69.87%,70.87%{transform:translateY(3px)} 70.97%{transform:none} 100%{transform:none}}
