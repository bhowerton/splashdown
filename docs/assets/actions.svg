.work2{animation:work2 18s linear infinite}
@keyframes done0{0%,18.50%{opacity:0} 19.10%,29.00%{opacity:1} 29.60%,100%{opacity:0}}
.done0{animation:done0 18s linear infinite}
@keyframes win0{0%,18.50%{opacity:0} 19.10%,32.00%{opacity:1} 32.60%,100%{opacity:0}}
.win0{animation:win0 18s linear infinite}
@keyframes done1{0%,51.83%{opacity:0} 52.43%,62.33%{opacity:1} 62.93%,100%{opacity:0}}
.done1{animation:done1 18s linear infinite}
@keyframes win1{0%,51.83%{opacity:0} 52.43%,65.33%{opacity:1} 65.93%,100%{opacity:0}}
