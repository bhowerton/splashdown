<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d">
<title id="t">Watched folders and subtitles</title>
<desc id="d">A recording, standup.mp4, is copied into a folder Splashdown watches. Once it has finished copying, it is transcribed on this computer into a note line by line, with time stamps. Then standup.srt appears beside the video in the folder, and the video plays with those subtitles: "We moved the launch to the 17th."</desc>
<style>@keyframes copying{0%,3.40%{opacity:0} 4.00%,20.00%{opacity:1} 20.60%,100%{opacity:0}}
.copying{animation:copying 18s linear infinite}
@keyframes copied{0%,20.00%{opacity:0} 20.60%,99.40%{opacity:1}}
.copied{animation:copied 18s linear infinite}
@keyframes new-mp4{0%,3.40%{opacity:0;transform:translateY(6px)} 4.00%,99.40%{opacity:1;transform:none}}
.new-mp4{animation:new-mp4 18s linear infinite}
@keyframes progress{0%,4%{transform:scaleX(0)}20%,100%{transform:scaleX(1)}}
.progress{transform-box:fill-box;transform-origin:left;animation:progress 18s linear infinite}
@keyframes working{0%,22.40%{opacity:0} 23.00%,60.00%{opacity:1} 60.60%,100%{opacity:0}}
.working{animation:working 18s linear infinite}
@keyframes note{0%,24.40%{opacity:0} 25.00%,99.40%{opacity:1}}
.note{animation:note 18s linear infinite}
@keyframes r0{0%,29.40%{opacity:0;transform:translateY(6px)} 30.00%,99.40%{opacity:1;transform:none}}
.r0{animation:r0 18s linear infinite}
@keyframes r1{0%,36.90%{opacity:0;transform:translateY(6px)} 37.50%,99.40%{opacity:1;transform:none}}
.r1{animation:r1 18s linear infinite}
@keyframes r2{0%,44.40%{opacity:0;transform:translateY(6px)} 45.00%,99.40%{opacity:1;transform:none}}
.r2{animation:r2 18s linear infinite}
@keyframes r3{0%,51.90%{opacity:0;transform:translateY(6px)} 52.50%,99.40%{opacity:1;transform:none}}
.r3{animation:r3 18s linear infinite}
@keyframes srt{0%,62.40%{opacity:0;transform:translateY(6px)} 63.00%,99.40%{opacity:1;transform:none}}
.srt{animation:srt 18s linear infinite}
@keyframes cap0{0%,67.40%{opacity:0} 68.00%,80.00%{opacity:1} 80.60%,100%{opacity:0}}
.cap0{animation:cap0 18s linear infinite}
@keyframes cap1{0%,80.00%{opacity:0} 80.60%,92.00%{opacity:1} 92.60%,100%{opacity:0}}
.cap1{animation:cap1 18s linear infinite}
@keyframes cap2{0%,92.00%{opacity:0} 92.60%,99.00%{opacity:1} 99.60%,100%{opacity:0}}
.cap2{animation:cap2 18s linear infinite}
@keyframes say0{0%,0.40%{opacity:0} 1.00%,27.00%{opacity:1} 27.60%,100%{opacity:0}}
.say0{animation:say0 18s linear infinite}
@keyframes say1{0%,27.40%{opacity:0} 28.00%,62.00%{opacity:1} 62.60%,100%{opacity:0}}
.say1{animation:say1 18s linear infinite}
@keyframes say2{0%,62.40%{opacity:0} 63.00%,99.00%{opacity:1} 99.60%,100%{opacity:0}}
.say2{animation:say2 18s linear infinite}

@keyframes flow{to{stroke-dashoffset:-28}}
.flow{animation:flow .6s linear infinite}
@keyframes bar{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
.bar{transform-box:fill-box;transform-origin:center;animation:bar .45s ease-in-out infinite alternate}
.bar:nth-of-type(2n){animation-delay:-.15s}.bar:nth-of-type(3n){animation-delay:-.3s}
@keyframes twinkle{0%,100%{opacity:.9}50%{opacity:.35}}
.star{animation:twinkle 3s ease-in-out infinite}
.star:nth-of-type(2n){animation-delay:-1.4s}.star:nth-of-type(3n){animation-delay:-2.1s}

/* Without motion: the finished note, the subtitles beside the video. */
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .copying,.working,.say0,.say1,.cap1,.cap2{opacity:0}
  .copied,.new-mp4,.note,.r0,.r1,.r2,.r3,.srt,.cap0,.say2{opacity:1;transform:none}
}
</style>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="480" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#0A1440"/><stop offset=".65" stop-color="#16337A"/><stop offset="1" stop-color="#2F64B8"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="440" x2="0" y2="480" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#0F6FA8"/><stop offset="1" stop-color="#06305C"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
  </filter>
  <clipPath id="card"><rect width="960" height="480" rx="28"/></clipPath>
</defs>
<g clip-path="url(#card)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="960" height="480" fill="url(#sky)"/>
  <circle class="star" cx="470" cy="40" r="2.2" fill="#fff"/><circle class="star" cx="560" cy="120" r="1.8" fill="#fff"/><circle class="star" cx="400" cy="330" r="2" fill="#fff"/><circle class="star" cx="580" cy="380" r="1.6" fill="#fff"/><circle class="star" cx="940" cy="420" r="2" fill="#fff"/>
  <path d="M0 458 C160 446 320 470 480 458 S800 446 960 458 V480 H0 Z" fill="url(#sea)"/>

  <!-- The watched folder, and the video with its subtitles. -->
  <g filter="url(#shadow)"><rect x="40" y="40" width="300" height="176" rx="14" fill="#fff"/></g><rect x="40" y="40" width="300" height="34" rx="14" fill="#EEF1F6"/><rect x="40" y="60" width="300" height="14" fill="#EEF1F6"/><circle cx="60" cy="57" r="5.5" fill="#FF5F57"/><circle cx="78" cy="57" r="5.5" fill="#FEBC2E"/><circle cx="96" cy="57" r="5.5" fill="#28C840"/><text x="210.0" y="62" text-anchor="middle" font-size="13" fill="#6B7280">Zoom Recordings</text><rect x="228" y="84" width="98" height="20" rx="10" fill="#FFEDD5"/><text x="277" y="98" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C2410C">watched</text><text x="58" y="98" font-size="11.5" font-weight="700" fill="#6B7280" letter-spacing=".04em">NAME</text><g class=""><rect x="58" y="117" width="16" height="20" rx="3" fill="#94A3B8"/><text x="84" y="132" font-size="14" fill="#111827">kickoff.mp4</text><text x="322" y="132" text-anchor="end" font-size="12.5" fill="#6B7280">Oct 28</text></g><g class="new-mp4"><rect x="58" y="149" width="16" height="20" rx="3" fill="#3B82F6"/><text x="84" y="164" font-size="14" fill="#111827">standup.mp4</text><text x="322" y="164" text-anchor="end" font-size="12.5" fill="#6B7280"></text></g><g class="copying"><rect x="230" y="156" width="92" height="6" rx="3" fill="#E5E7EB"/><rect class="progress" x="230" y="156" width="92" height="6" rx="3" fill="#2563EB"/></g><text class="copied" x="322" y="164" text-anchor="end" font-size="12.5" fill="#6B7280">Today</text><g class="srt"><rect x="58" y="181" width="16" height="20" rx="3" fill="#F2551F"/><text x="84" y="196" font-size="14" fill="#111827">standup.srt</text><text x="322" y="196" text-anchor="end" font-size="12.5" fill="#6B7280">subtitles</text></g>
  <g filter="url(#shadow)"><rect x="40" y="236" width="300" height="168" rx="14" fill="#0B1020"/></g><rect x="52" y="248" width="276" height="118" rx="8" fill="#1E293B"/><circle cx="144" cy="290" r="16" fill="#475569"/><path d="M118 340 a26 22 0 0 1 52 0z" fill="#475569"/><circle cx="236" cy="290" r="16" fill="#64748B"/><path d="M210 340 a26 22 0 0 1 52 0z" fill="#64748B"/><path d="M60 382 l9 6 -9 6z" fill="#fff"/><rect x="80" y="386" width="240" height="4" rx="2" fill="#334155"/><rect class="progress" x="80" y="386" width="96" height="4" rx="2" fill="#F2551F"/><g class="cap0"><rect x="49" y="336" width="282" height="26" rx="4" fill="#000" fill-opacity=".72"/><text x="190.0" y="354" text-anchor="middle" font-size="14" fill="#fff">We moved the launch to the 17th.</text></g><g class="cap1"><rect x="57" y="336" width="266" height="26" rx="4" fill="#000" fill-opacity=".72"/><text x="190.0" y="354" text-anchor="middle" font-size="14" fill="#fff">Anselm owns the installer fix.</text></g><g class="cap2"><rect x="57" y="336" width="266" height="26" rx="4" fill="#000" fill-opacity=".72"/><text x="190.0" y="354" text-anchor="middle" font-size="14" fill="#fff">The budget stays where it was.</text></g>

  <!-- Splashdown, transcribing. -->
  <g class="working"><g filter="url(#shadow)"><rect x="372" y="196" width="206" height="48" rx="24" fill="#17171C" fill-opacity=".94"/></g><circle cx="396" cy="220" r="6" fill="#F2551F"/><text x="410" y="226" font-size="16" font-weight="600" fill="#F4F4F5">Transcribing</text><g><rect class="bar" x="520" y="211" width="4" height="18" rx="2" fill="#FF9A3D"/><rect class="bar" x="528" y="211" width="4" height="18" rx="2" fill="#FF9A3D"/><rect class="bar" x="536" y="211" width="4" height="18" rx="2" fill="#FF9A3D"/><rect class="bar" x="544" y="211" width="4" height="18" rx="2" fill="#FF9A3D"/><rect class="bar" x="552" y="211" width="4" height="18" rx="2" fill="#FF9A3D"/><rect class="bar" x="560" y="211" width="4" height="18" rx="2" fill="#FF9A3D"/></g><path class="flow" d="M340 160 C370 160 332 220.0 372 220.0" fill="none" stroke="#FF9A3D" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12"/><path class="flow" d="M578 220.0 H612" fill="none" stroke="#FF9A3D" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12"/></g>

  <!-- The note it becomes. -->
  <g filter="url(#shadow)"><rect x="612" y="40" width="308" height="364" rx="14" fill="#fff"/></g><rect x="612" y="40" width="308" height="34" rx="14" fill="#EEF1F6"/><rect x="612" y="60" width="308" height="14" fill="#EEF1F6"/><circle cx="632" cy="57" r="5.5" fill="#FF5F57"/><circle cx="650" cy="57" r="5.5" fill="#FEBC2E"/><circle cx="668" cy="57" r="5.5" fill="#28C840"/><text x="786.0" y="62" text-anchor="middle" font-size="13" fill="#6B7280">Notes</text><g class="note"><text x="632" y="110" font-size="18" font-weight="700" fill="#111827">standup</text><text x="632" y="130" font-size="12.5" fill="#6B7280">From standup.mp4 · on this computer</text><g class="r0"><text x="632" y="168" font-size="12" fill="#2563EB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0:00</text><text x="674" y="168" font-size="14" fill="#111827">Morning, quick standup today.</text></g><g class="r1"><text x="632" y="208" font-size="12" fill="#2563EB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0:06</text><text x="674" y="208" font-size="14" fill="#111827">We moved the launch to the 17th.</text></g><g class="r2"><text x="632" y="248" font-size="12" fill="#2563EB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0:11</text><text x="674" y="248" font-size="14" fill="#111827">Anselm owns the installer fix.</text></g><g class="r3"><text x="632" y="288" font-size="12" fill="#2563EB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0:15</text><text x="674" y="288" font-size="14" fill="#111827">The budget stays where it was.</text></g><g class="srt"><rect x="626" y="340" width="280" height="44" rx="10" fill="#EEF4FF"/><text x="640" y="367" font-size="13.5" fill="#111827"><tspan font-weight="700" fill="#2563EB">Subtitles saved </tspan>beside the video</text></g></g>

  <text class="say0" x="480.0" y="440" text-anchor="middle" font-size="19" font-style="italic" fill="#E6ECFF">A recording lands in a folder you chose…</text>
  <text class="say1" x="480.0" y="440" text-anchor="middle" font-size="19" font-style="italic" fill="#E6ECFF">…and becomes a note by itself, on your computer…</text>
  <text class="say2" x="480.0" y="440" text-anchor="middle" font-size="19" font-style="italic" fill="#E6ECFF">…with subtitles saved beside the video</text>
</g>
</svg>
