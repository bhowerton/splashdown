[package]
name = "splashdown-llm"
description = "Helper process that runs Splashdown's built-in local text model (llama.cpp)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
llama-cpp-2.workspace = true
serde_json.workspace = true
splashdown-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { workspace = true, features = ["metal"] }

[features]
# llama.cpp's Vulkan backend, for graphics chips on Windows (needs the
# Vulkan SDK at build time; scripts/package-win.ps1 uses it when present).
vulkan = ["llama-cpp-2/vulkan"]
