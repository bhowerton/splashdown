[package]
name = "splashdown-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
splashdown-audio.workspace = true
splashdown-config.workspace = true
splashdown-core.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
whisper-rs = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
futures-executor.workspace = true
splashdown-apple-shim.workspace = true
whisper-rs = { workspace = true, optional = true, features = ["metal"] }

[features]
default = ["whisper-local"]
# Local speech-to-text with whisper.cpp (needs cmake and a C++ compiler).
whisper-local = ["dep:whisper-rs"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
