[package]
name = "splashdown-cli"
description = "Developer harness for the Splashdown pipeline: record, transcribe, clean up, eval."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "splashdown-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
async-trait.workspace = true
clap.workspace = true
dotenvy.workspace = true
hound.workspace = true
splashdown-audio.workspace = true
splashdown-config.workspace = true
splashdown-control.workspace = true
splashdown-core.workspace = true
splashdown-providers.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
reqwest.workspace = true
splashdown-platform.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
toml.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
splashdown-apple-shim.workspace = true
# Computer use (exploration): Cua Driver's MIT-licensed driver, pinned.
cua-driver-sdk = { git = "https://github.com/trycua/cua", rev = "50242387d74cf82ccbed20846fc134e7a49ffa7c" }

[features]
default = ["local-speech", "natural-voice"]
local-speech = ["splashdown-providers/local-speech"]
natural-voice = ["splashdown-providers/natural-voice"]
