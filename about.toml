# Third-party license notices for release builds, generated by
# `cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html`
# (scripts/package-mac.sh does this). Same allow list as deny.toml.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "BSL-1.0",
]
workarounds = ["ring"]

# Only in sherpa-onnx's build script (see deny.toml); listed with the rest.
[webpki-roots]
accepted = ["CDLA-Permissive-2.0"]

[libbz2-rs-sys]
accepted = ["bzip2-1.0.6"]
